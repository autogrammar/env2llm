# wup.yaml — on-change regression watcher for env2llm (dev loop only; CI uses pyqual/regix).
#
# Quick start:
#   wup status
#   wup map-deps
#   wup watch

project:
  name: env2llm
  description: Environment map generator — watch src/ and run quick pytest on change.

watch:
  paths:
    - src/**
    - tests/**
  file_types:
    - .py
  excludes:
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/.pytest_cache/**"
    - "**/*.md"

services:
  - name: core
    root: src/env2llm
    paths:
      - src/env2llm/**
      - tests/**
    type: auto
    quick_tests:
      scope: all
      max_endpoints: 3
    full_tests:
      scenario: testql-scenarios/generated-from-pytests.testql.toon.yaml

test_strategy:
  quick:
    debounce_s: 2
    max_queue: 5
    timeout_s: 15
  full:
    debounce_s: 5
    timeout_s: 120
    only_on_quick_fail: true

reporting:
  dashboard: true
  blame_log: .wup/blame-history.jsonl
  webhook_url: "${WUP_WEBHOOK_URL:-}"

resources:
  max_cpu_percent: 70
  defer_below_idle_percent: 20

# BEGIN WUP MONITORING MANIFEST (auto-generated — do not edit; run: wup sync-testql --write)
monitoring:
  generated_at: '2026-09-02T06:18:27Z'
  generated_by: wup sync-testql --write (or wup watch startup)
  how_to_refresh: wup sync-testql . --write
  probe_interval_s: 60
  health_scenario: ''
  base_url: (set testql.base_url or WUP_BASE_URL)
  endpoint_discovery: true
  scenario_dir: scenarios/tests
  service_map_globs: []
  docker_compose_files: []
  semcod_tools:
    enabled: false
    tools: {}
  wup_services:
    core:
      wup_paths:
      - src/env2llm/**
      - tests/**
      docker: []
      live_probes: []
      testql_dry_run_scenarios: []
  docker_not_mapped_to_wup: []
  troubleshooting:
    probe_failed_check:
    - Czy kontener z sekcji docker jest uruchomiony (docker ps)?
    - Czy host_ports mapuje na URL w live_probes (np. 8100 vs 8202)?
    - Czy błąd dotyczy proxy frontendu (/firmware na :8100) vs bezpośredniego :8202?
    - 'Czy endpoint jest w live_probes — jeśli nie, uruchom: wup sync-testql . --write'
    config_vs_runtime: Pole live_probes to faktyczne żądania HTTP WUP. Jeśli endpointu
      tu nie ma, WUP go nie sprawdza — to błąd konfiguracji, nie aplikacji.
# END WUP MONITORING MANIFEST
