[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "env2llm"
version = "0.1.14"
description = "Generate environment maps (services, artifacts, env vars) for LLM decision-making"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.0"]
mqtt = ["paho-mqtt>=2.0"]
serve = []
mcp = []
nlp2uri = ["nlp2uri[envmap]>=0.4.7"]
dev = [
    "pytest>=8.0",
    "costs>=0.1.20",
]

[project.scripts]
env2llm = "env2llm.cli:main"
env2llm-serve = "env2llm.integrators.rest_server:main"
env2llm-mcp = "env2llm.integrators.mcp_server:main"
env2llm-mqtt = "env2llm.integrators.mqtt_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"env2llm.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p wellmanifest_governance", "-v"]

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.uv.dependency-groups.automation]
requires-python = ">=3.12"

[dependency-groups]
automation = ["goal>=2.1.302"]

[tool.wellmanifest]
standard = "0.20.35"
revision = "cfaa0bf0ea6b0e7349fed0bb62b5ce15792d687d"
gate = "project/governance-check.sh"
